# Nginx phục vụ dashboard (SPA React đã build) và chuyển tiếp /api tới FastAPI.
# Chép vào /etc/nginx/sites-available/ids rồi liên kết sang sites-enabled (setup_vps.sh làm việc này).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Thư mục chứa frontend đã build (deploy/setup_vps.sh chép dist/ vào đây)
    root /var/www/ids;
    index index.html;

    # Cho phép tải CSV phân tích thử (POST /api/analyze) và pcap replay lớn
    client_max_body_size 64m;

    # API: chuyển tiếp tới tiến trình FastAPI chạy nội bộ
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: mọi đường dẫn khác trả index.html để React Router tự định tuyến
    location / {
        try_files $uri $uri/ /index.html;
    }
}
